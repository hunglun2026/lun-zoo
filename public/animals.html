<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動物小百科｜動物探險家</title>
<meta name="description" content="搜尋與篩選臺北市立動物園的動物，查看照片、影片、棲地、食性與保育等級。">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

</head>
<body data-page="animals">
<main>
  <h1>📖 動物小百科</h1>
  <p class="lead">輸入名字找動物，或用下面的按鈕篩選。點一下動物看詳細介紹，還可以挑兩種「比一比」。</p>
  <section id="cmp" hidden></section>
  <input type="search" id="q" placeholder="輸入動物名字，例如：大貓熊" aria-label="搜尋動物">
  <details class="fbox" id="fbox"><summary id="fsum">篩選</summary><div class="filters" id="filters"></div></details>
  <p id="count" class="lead" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div id="cmpbar" class="cmpbar noprint" hidden></div>
  <dialog id="dlg"><div class="dlg-in" id="dlg-body"></div></dialog>
</main>
<script src="/js/data.js?v=18"></script>
<script src="/js/layout.js?v=18"></script>
<script src="/js/fx.js?v=18"></script>

</body>
